<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scanner Concord — Samsung A16</title>
  <script src="https://unpkg.com"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0; padding: 20px; background: #0f2537; color: #fff;
      display: flex; flex-direction: column; justify-content: space-between; min-height: 100vh;
    }
    .header { text-align: center; }
    .header h1 { font-size: 18px; margin: 0; letter-spacing: 1px; color: #c59b27; }
    .header p { font-size: 12px; color: #cbd5e1; margin: 4px 0 0 0; }

    .box {
      background: #1e3a5f; padding: 24px 18px; border-radius: 16px;
      text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    label.lbl { display: block; font-size: 12px; text-transform: uppercase; color: #cbd5e1; margin-bottom: 8px; font-weight: 700; }
    select {
      width: 100%; padding: 14px; font-size: 18px; font-weight: 800;
      border-radius: 10px; border: 2px solid #c59b27; background: #fff; color: #0f2537;
      margin-bottom: 24px; text-align: center;
    }
    .btn-cam {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 24px 16px; background: #c59b27; color: #000;
      font-size: 18px; font-weight: 900; border-radius: 14px; border: none;
      cursor: pointer; box-shadow: 0 6px 16px rgba(197,155,39,0.4);
    }
    .btn-cam:active { transform: scale(0.97); }
    input[type="file"] { display: none; }

    #msg {
      margin-top: 20px; padding: 12px; border-radius: 10px; font-size: 14px;
      font-weight: 700; background: rgba(255,255,255,0.1); color: #e2e8f0;
    }
    .footer { text-align: center; font-size: 11px; color: #94a3b8; }
  </style>
</head>
<body>

  <div class="header">
    <h1>HOTEL CONCORD TORINO</h1>
    <p>Fase 1 — Acquisizione Fotocamera</p>
  </div>

  <div class="box">
    <label class="lbl" for="termSelect">Seleziona Terminale PC</label>
    <select id="termSelect" onchange="saveTerm()">
      <option value="T1">TERMINALE 1</option>
      <option value="T2">TERMINALE 2</option>
    </select>

    <label for="camInput" class="btn-cam">
      📷 APRI FOTOCAMERA
    </label>
    <input type="file" id="camInput" accept="image/*" capture="environment">

    <div id="msg">Pronto. Inquadra le righe con &lt;&lt;&lt;</div>
  </div>

  <div class="footer">
    Elaborazione OCR e compilazione modulo avvengono in automatico sul PC.
  </div>

<script>
  const termSelect = document.getElementById('termSelect');
  termSelect.value = localStorage.getItem('concord_mobile_term') || 'T1';

  function saveTerm() {
    localStorage.setItem('concord_mobile_term', termSelect.value);
    setMsg('Impostato su ' + termSelect.value + '. Pronto a scattare.', '#e2e8f0');
  }

  function setMsg(text, color) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.style.color = color;
  }

  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        const MAX_W = 1400;
        let w = img.width;
        let h = img.height;
        if (w > MAX_W) {
          h = Math.round(h * (MAX_W / w));
          w = MAX_W;
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject;
      img.src = url;
    });
  }

  document.getElementById('camInput').addEventListener('change', async function(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    const targetTerm = termSelect.value;
    const targetPeerId = 'hotel-concord-torino-' + targetTerm.toLowerCase();

    setMsg('⏳ Invio scatto a ' + targetTerm + '...', '#fde047');

    try {
      const dataUrl = await compressImage(file);
      e.target.value = '';

      const peer = new Peer();
      peer.on('open', () => {
        const conn = peer.connect(targetPeerId, { reliable: true });
        conn.on('open', () => {
          conn.send({ type: 'MRZ_PHOTO', image: dataUrl, terminal: targetTerm });
          setMsg('✅ Inviato a ' + targetTerm + '! Pronto per il prossimo scatto.', '#4ade80');
          setTimeout(() => peer.destroy(), 1500);
        });
        conn.on('error', () => {
          setMsg('❌ PC ' + targetTerm + ' non raggiungibile. Apri pc.html sul PC!', '#f87171');
        });
      });

      peer.on('error', (err) => {
        setMsg('❌ Errore rete (' + err.type + '). Verifica pc.html sul PC.', '#f87171');
      });
    } catch (err) {
      setMsg('❌ Errore lettura foto.', '#f87171');
    }
  });
</script>
</body>
</html>
